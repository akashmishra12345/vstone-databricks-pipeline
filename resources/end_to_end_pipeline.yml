resources:
  jobs:
    end_to_end_pipeline:
      name: end_to_end_pipeline
      tasks:
        - task_key: 01_ingestion
          run_job_task:
            job_id: ${resources.jobs.copy_into_job.id}
        
        - task_key: 02_ingestion
          run_job_task:
            job_id: ${resources.jobs.day2_and_day3.id}
          
        - task_key: 03_ingestion
          depends_on:
            - task_key: 02_ingestion
            - task_key: 01_ingestion
          pipeline_task:
            pipeline_id: ${resources.pipelines.pipeline_remaining_files_dlt.id}
            full_refresh: false
          
        - task_key: 04_silver_transformation
          depends_on:
            - task_key: 03_ingestion
          pipeline_task:
            pipeline_id: ${resources.pipelines.pipeline_silver_transformations_dlt.id}
            full_refresh: false

        - task_key: 05_gold_layer
          depends_on:
            - task_key: 04_silver_transformation
          pipeline_task:
            pipeline_id: ${resources.pipelines.pipeline_gold_layer_dlt_pipeline.id}

        - task_key: Market_Intelligence_Performance
          depends_on:
            - task_key: 05_gold_layer
          dashboard_task: 
            dashboard_id: ${resources.dashboards.d1.id}

        - task_key: Car_Market_Analytics
          depends_on:
            - task_key: 05_gold_layer
          dashboard_task: 
            dashboard_id: ${resources.dashboards.d2.id}
          
      queue:
        enabled: true
      performance_target: PERFORMANCE_OPTIMIZED
