resources:
  jobs:
    day2_and_day3:
      name: day2_and_day3
      tasks:
        - task_key: autoloader
          notebook_task:
            notebook_path: ../src/bronze/04_bronze_auto_loader.py
            source: WORKSPACE
          min_retry_interval_millis: 900000
          disable_auto_optimization: true
          environment_key: Default
        - task_key: xml_ingestion
          notebook_task:
            notebook_path: ../src/bronze/05_bronze_xml_pyspark.py
            source: WORKSPACE
          environment_key: Default
        - task_key: dlt_pipeline
          pipeline_task:
            pipeline_id: ${resources.pipelines.pipeline_chunk4_dlt.id}
      queue:
        enabled: true
      environments:
        - environment_key: Default
          spec:
            environment_version: "4"
      performance_target: PERFORMANCE_OPTIMIZED