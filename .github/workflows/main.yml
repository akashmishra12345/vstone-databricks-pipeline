name: Vstone Databricks Validation & Testing

on:
  push:
    branches:
      - dev

permissions:
  contents: read

# ─────────────────────────────────────────────────────────────────────────────
# Global credentials — defined once, used in every job that needs them
# ─────────────────────────────────────────────────────────────────────────────
env:
  DATABRICKS_HOST:  ${{ secrets.DATABRICKS_HOST }}
  DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

jobs:

  # ============================================================
  # 1. Validate Bundle Configuration
  # ============================================================
  validate-bundle:
    name: Validate Bundle Configuration
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Validate Databricks Bundle
        working-directory: ./vstone_project
        run: databricks bundle validate


  # ============================================================
  # 2. Run Unit Tests — Parallel Matrix across all 4 layers
  # ============================================================
  run-unit-tests:
    name: Run ${{ matrix.layer }} Unit Tests
    runs-on: ubuntu-latest
    needs: validate-bundle             # wait for bundle validation to pass

    strategy:
      fail-fast: false                 # keep all 4 layers running even if one fails
      matrix:
        layer:
          - data_chunking
          - bronze_layer
          - silver_layer
          - gold_layer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Java 17 (required by PySpark)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov pytest-html databricks-connect pyspark==3.5.1

      - name: Run ${{ matrix.layer }} tests
        run: |
          pytest tests/test_${{ matrix.layer }}.py \
            -v \
            --maxfail=5 \
            --tb=short \
            --junit-xml=reports/${{ matrix.layer }}_results.xml
        env:
          DATABRICKS_SERVERLESS_COMPUTE_ID: "auto"
          PYSPARK_PYTHON: python3

      - name: Upload test results
        if: always()                   # upload even on test failure
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.layer }}
          path: reports/${{ matrix.layer }}_results.xml
          retention-days: 14


  # ============================================================
  # 3. Publish Combined Test Report
  # ============================================================
  publish-test-report:
    name: Publish Test Report
    runs-on: ubuntu-latest
    needs: run-unit-tests
    if: always()                       # always run so report is visible on failure

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all test result artifacts
        uses: actions/download-artifact@v4
        with:
          path: reports/

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install report dependencies
        run: pip install pytest-html junitparser

      - name: Merge JUnit XML reports
        run: |
          pip install junitparser
          python - <<'EOF'
          from junitparser import JUnitXml, TestSuite
          import glob, os

          merged = JUnitXml()
          for path in glob.glob("reports/**/*.xml", recursive=True):
              merged += JUnitXml.fromfile(path)
          os.makedirs("reports/merged", exist_ok=True)
          merged.write("reports/merged/all_results.xml")
          print(f"Merged {len(list(glob.glob('reports/**/*.xml', recursive=True)))} result files")
          EOF

      - name: Upload merged report
        uses: actions/upload-artifact@v4
        with:
          name: combined-test-report
          path: reports/merged/all_results.xml
          retention-days: 30


  # ============================================================
  # 4. Deploy Bundle and Run Databricks Job
  #    Only runs when ALL 4 test layers pass
  # ============================================================
  deploy-and-run:
    name: Deploy and Run Jobs
    runs-on: ubuntu-latest
    needs: run-unit-tests              # blocked until bronze + silver + gold + chunking all pass

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Databricks CLI
        uses: databricks/setup-cli@main

      - name: Deploy Bundle to dev
        working-directory: ./vstone_project
        run: databricks bundle deploy --target dev

      - name: Run Databricks Pipeline Job
        working-directory: ./vstone_project
        run: databricks bundle run vstone_pipeline_job --target dev

      - name: Notify on deployment success
        if: success()
        run: |
          echo "✅ vstone_project deployed and pipeline job triggered successfully."
          echo "Branch : ${{ github.ref_name }}"
          echo "Commit : ${{ github.sha }}"
          echo "Actor  : ${{ github.actor }}"