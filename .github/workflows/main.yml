name: Databricks CI/CD
on:
  push:
    branches:
      - feature/bronze-layer
  pull_request:
    branches:
      - dev

jobs:
  validate-bundle:
    name: Validate Bundle Configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install dependencies
        run: |
          pip install pyyaml

  run-bronze-tests:
    name: Run Bronze Unit Tests
    if: github.ref == 'refs/heads/feature/bronze-layer' || github.base_ref == 'dev' || github.ref == 'refs/heads/dev'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.10"
      - name: Install test dependencies
        run: |
          pip uninstall -y pyspark pyspark-connect databricks-connect || true
          pip install pytest pyyaml databricks-connect
      
      # FIX: Added '-W ignore::DeprecationWarning' to suppress the version mismatch warnings
      - name: Run unit tests
        run: |
          pytest tests/bronze_testing/ -v -m "not integration" -W ignore::DeprecationWarning
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
          DATABRICKS_SERVERLESS_COMPUTE_ID: "auto"
