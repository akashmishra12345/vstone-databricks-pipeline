# Databricks Asset Bundle configuration
bundle:
  name: "vstone_project"

# Includes all your resource definitions (Pipelines/Jobs)
include:
  - resources/*.yml
  - resources/*/*.yml

targets:
  # Default development target
  dev:
    mode: development
    default: true
    workspace:
      host: https://dbc-06838378-a321.cloud.databricks.com

  # Production target with fixed syntax
  prod:
    mode: production
    workspace:
      host: https://dbc-06838378-a321.cloud.databricks.com
      root_path: /Users/akash.r.mishra@v4c.ai/.bundle/${bundle.name}/${bundle.target}
    run_as:
      # Removed 'permissions' from here to fix the error
      user_name: akash.r.mishra@v4c.ai

# Optional: Global variables that you can use across your notebooks as widgets
variables:
  catalog:
    default: "vstone_catalog"
  env:
    default: "dev"