resources:
  jobs:
    vstone_end_to_end_pipeline:
      name: VStone_Medallion_Orchestration
      tasks:
        # --- BRONZE LAYER ---
        - task_key: 01_bronze_csv
          notebook_task:
            notebook_path: /Workspace/Users/akash.r.mishra@v4c.ai/vstone-databricks-pipeline/vstone_project/src/notebooks/03_bronze_csv_copyinto.py
            max_retries: 0 # Requirement: auto-optimization to disallow retries
          disable_auto_optimization: true

        - task_key: 02_bronze_json
          depends_on:
            - task_key: 01_bronze_csv
          notebook_task:
            notebook_path: /Workspace/Users/akash.r.mishra@v4c.ai/vstone-databricks-pipeline/vstone_project/src/notebooks/04_bronze_auto_loader
          max_retries: 0

        - task_key: 03_bronze_xml
          depends_on:
            - task_key: 02_bronze_json
          notebook_task:
            notebook_path: /Workspace/Users/akash.r.mishra@v4c.ai/vstone-databricks-pipeline/vstone_project/src/notebooks/05_bronze_xml_pyspark
          max_retries: 0
        
        - task_key: 04_bronze_dlt
          depends_on:
            - task_key: 03_bronze_xml
          pipeline_task:
            pipeline_id: ${resources.pipelines.vstone_bronze_dlt.id} # From your existing DLT setup
            full_refresh: false
        
        - task_key: 05_bronze_reamining_files
          depends_on:
            - task_key: 04_bronze_dlt
          pipeline_task:
            pipeline_id: ${resources.pipelines.vstone_remaining_files_dlt.id} # From your existing DLT setup
            full_refresh: false

        # --- SILVER LAYER ---
        - task_key: 05_silver_transfromations
          depends_on:
            - task_key: 05_bronze_reamining_files
          notebook_task:
            notebook_path: /Workspace/Users/akash.r.mishra@v4c.ai/vstone-databricks-pipeline/vstone_project/src/notebooks/08_silver_transformation
          max_retries: 0

        - task_key: 05_silver_time_travel
          depends_on:
            - task_key: 05_silver_transfromations
          notebook_task:
            notebook_path: /Workspace/Users/akash.r.mishra@v4c.ai/vstone-databricks-pipeline/vstone_project/src/notebooks/09_bussiness_and_delta_timetravel
          max_retries: 0

        # --- GOLD LAYER (DLT) ---
        - task_key: 06_gold_dlt_pipeline
          depends_on:
            - task_key: 05_silver_time_travel
          pipeline_task:
            pipeline_id: ${resources.pipelines.vstone_gold_dlt.id} # From your existing DLT setup
            full_refresh: false

      queue:
        enabled: true # Helps manage Free Edition resource limits [cite: 27]